name: Deploy PROD to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.PROD_GCP_REGION || secrets.GCP_REGION || 'europe-west1' }}
  SERVICE_NAME: shuttler-club-web-prod
  REPOSITORY_NAME: shuttler-club-web

jobs:
  deploy:
    name: Build & Deploy PROD to Cloud Run
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_SA_KEY || secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry Repository Exists
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY_NAME }} --location=${{ env.GCP_REGION }} --quiet || \
          gcloud artifacts repositories create ${{ env.REPOSITORY_NAME }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Docker repository for Shuttler Club Web" --quiet

      - name: Build & Push Docker Image
        env:
          IMAGE_TAG: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:latest
        run: |
          docker build \
            --build-arg FIREBASE_API_KEY="${{ secrets.PROD_FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}" \
            --build-arg FIREBASE_AUTH_DOMAIN="${{ secrets.PROD_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg FIREBASE_DATABASE_URL="${{ secrets.PROD_FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}" \
            --build-arg FIREBASE_PROJECT_ID="${{ secrets.PROD_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}" \
            --build-arg FIREBASE_STORAGE_BUCKET="${{ secrets.PROD_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}" \
            --build-arg FIREBASE_MESSAGING_SENDER_ID="${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg FIREBASE_APP_ID="${{ secrets.PROD_FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}" \
            --build-arg VITE_APP_ENV="PROD" \
            --build-arg VITE_GIT_BRANCH="main" \
            -t $IMAGE_TAG \
            -t $IMAGE_LATEST \
            .

          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'

      - name: Output Service URL
        run: |
          echo "======================================================="
          echo "Successfully deployed PROD to Cloud Run!"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "======================================================="
